# Typecheck on every push and PR.
#
# The point is to keep compilation off a development laptop: this repo has no
# build step of its own (herdr runs `bun install --frozen-lockfile` at plugin
# install time), so "CI" here means install + typecheck and nothing more.
#
# It runs on push for ALL branches, not just main, so a feature branch is
# checked the moment it is pushed, before a PR exists.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Blocking: the scope tsconfig.json actually covers today.
  typecheck:
    name: typecheck (src)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          # Reads `packageManager` from package.json, so bun has one source of
          # truth for local runs and CI. If this ever resolves to `latest`
          # instead, replace with an explicit `bun-version: "1.3.11"`.
          bun-version-file: package.json
      # The same command herdr's plugin [[build]] runs, so a lockfile that has
      # drifted from package.json fails here rather than in herdr.
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  # Advisory only: tsconfig.json includes `src/**/*.ts`, so plugin/, tools/ and
  # gen-tokens.ts (9 tracked files) have never been typechecked. This job
  # measures them without failing the build; promote it to blocking once the
  # errors are cleared and they move into tsconfig.json.
  typecheck-uncovered:
    name: typecheck (plugin, tools, gen-tokens) [advisory]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run typecheck:extra
